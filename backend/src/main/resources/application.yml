server:
  port: 8080

spring:
  application:
    name: study-assistance
  datasource:
    url: jdbc:mysql://localhost:3307/study_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    driverClassName: com.mysql.cj.jdbc.Driver
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

jwt:
  secret: StudyAssistanceSecretKeyForJWTTokenGeneration2024VeryLongAndSecure
  expiration: 86400000

knife4j:
  enable: true
  setting:
    language: zh_cn

luogu:
  base-url: https://open-v1.lgapi.cn
  token: your-openapp-token-here
