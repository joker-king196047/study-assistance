server:
  port: 8080

spring:
  application:
    name: study-assistance
  datasource:
    url: jdbc:h2:mem:study_db;DB_CLOSE_DELAY=-1
    driverClassName: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

jwt:
  secret: StudyAssistanceSecretKeyForJWTTokenGeneration2024VeryLongAndSecure
  expiration: 86400000

knife4j:
  enable: true
  setting:
    language: zh_cn
