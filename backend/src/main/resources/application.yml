server:
  port: 8080

spring:
  application:
    name: study-assistance
  datasource:
    url: jdbc:mysql://localhost:3306/study_assistance?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

jwt:
  secret: StudyAssistanceSecretKeyForJWTTokenGeneration2024VeryLongAndSecure
  expiration: 86400000

knife4j:
  enable: true
  setting:
    language: zh_cn
